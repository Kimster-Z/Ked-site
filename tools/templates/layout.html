<script>
/* Ouverture locale (double-clic sur index.html) : les navigateurs n'ouvrent pas
   index.html automatiquement dans un dossier. En ligne, ce script ne fait rien. */
if (location.protocol === 'file:') {
  [].forEach.call(document.querySelectorAll('a[href]'), function (a) {
    var h = a.getAttribute('href');
    if (/^([a-z]+:|#|\/\/)/i.test(h)) return;
    var i = h.indexOf('#'), path = i < 0 ? h : h.slice(0, i), hash = i < 0 ? '' : h.slice(i);
    if (path === '') path = './';
    if (path.slice(-1) === '/') a.setAttribute('href', path + 'index.html' + hash);
  });
}
</script>
