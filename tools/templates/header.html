<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{home}}" aria-label="KED">
      <img src="{{root}}assets/img/logo-ked.png" alt="KED" width="480" height="132">
    </a>
    <nav class="nav" aria-label="{{nav_label}}">
      <a href="{{home}}#produit">{{nav_product}}</a>
      <a href="{{home}}#pourquoi">{{nav_why}}</a>
      <a href="{{home}}#ou-trouver">{{nav_map}}</a>
      <a href="{{home}}#evenements">{{nav_events}}</a>
      <a href="{{home}}#partenaires">{{nav_partners}}</a>
    </nav>
    <div class="header-actions">
      <nav class="lang" aria-label="{{lang_label}}">
{{lang_links}}
      </nav>
      <details class="menu">
        <summary><span>{{nav_menu}}</span><i aria-hidden="true"></i></summary>
        <nav aria-label="{{nav_label}}">
          <a href="{{home}}#produit">{{nav_product}}</a>
          <a href="{{home}}#pourquoi">{{nav_why}}</a>
          <a href="{{home}}#ou-trouver">{{nav_map}}</a>
          <a href="{{home}}#evenements">{{nav_events}}</a>
          <a href="{{home}}#partenaires">{{nav_partners}}</a>
        </nav>
      </details>
    </div>
  </div>
</header>
